<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2017" />
      <stop offset="100%" stop-color="#140E0A" />
    </linearGradient>
    <radialGradient id="cognacLeather" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8E4E25" />
      <stop offset="60%" stop-color="#5C2E12" />
      <stop offset="100%" stop-color="#381907" />
    </radialGradient>
    <linearGradient id="chromeG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="50%" stop-color="#AAA" />
      <stop offset="100%" stop-color="#444" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="10" fill="url(#g2Bg)" />
  <!-- Warm Spotlight -->
  <ellipse cx="300" cy="220" rx="220" ry="180" fill="#6B3C1B" opacity="0.25" />

  <!-- Cognac Brown Barber Chair -->
  <g transform="translate(180, 50) scale(0.8)">
    <ellipse cx="150" cy="420" rx="120" ry="24" fill="url(#chromeG2)" />
    <rect x="135" y="320" width="30" height="95" fill="url(#chromeG2)" />
    <!-- Footrest -->
    <path d="M100 320 L50 390 L120 410" fill="none" stroke="url(#chromeG2)" stroke-width="8" />
    <!-- Seat -->
    <path d="M60 250 L240 250 L230 310 L70 310 Z" fill="url(#cognacLeather)" stroke="#221107" stroke-width="2" />
    <!-- Backrest with Chesterfield Buttons -->
    <rect x="80" y="130" width="140" height="120" rx="12" fill="url(#cognacLeather)" stroke="#C5A059" stroke-width="2" />
    <circle cx="120" cy="170" r="4" fill="#C5A059" />
    <circle cx="180" cy="170" r="4" fill="#C5A059" />
    <circle cx="150" cy="205" r="4" fill="#C5A059" />
    <!-- Headrest -->
    <rect x="115" y="80" width="70" height="30" rx="6" fill="url(#cognacLeather)" stroke="#C5A059" stroke-width="1.5" />
    <!-- Padded Armrests -->
    <rect x="40" y="210" width="35" height="15" rx="5" fill="url(#cognacLeather)" />
    <rect x="225" y="210" width="35" height="15" rx="5" fill="url(#cognacLeather)" />
  </g>

  <rect x="0" y="380" width="600" height="70" fill="rgba(15,14,13,0.9)" />
  <text x="30" y="415" font-family="'Cairo', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">لون جلد هافان / كونياك كلاسيكي</text>
  <text x="30" y="435" font-family="'Cairo', sans-serif" font-size="12" font-weight="600" fill="#D4AF37">خياطة كابوتونيه وتخصيص ألوان التنجيد حسب الديكور</text>
</svg>
