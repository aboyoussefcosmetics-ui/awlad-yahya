<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2226" />
      <stop offset="100%" stop-color="#0E1012" />
    </linearGradient>
    <linearGradient id="chromeG4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="40%" stop-color="#B0B5B9" />
      <stop offset="80%" stop-color="#555A5F" />
      <stop offset="100%" stop-color="#D0D5DA" />
    </linearGradient>
    <linearGradient id="goldG4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3B5" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#916F20" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="10" fill="url(#g4Bg)" />

  <!-- Hydraulic & Chrome Disc Close-up -->
  <g transform="translate(60, 40)">
    <!-- Polished Base Disc -->
    <ellipse cx="240" cy="300" rx="200" ry="40" fill="url(#chromeG4)" stroke="#111" stroke-width="2" />
    <ellipse cx="240" cy="295" rx="180" ry="32" fill="#1C1F22" />
    <!-- Center Cylinder Column -->
    <rect x="200" y="100" width="80" height="190" fill="url(#chromeG4)" stroke="#222" />
    <rect x="195" y="270" width="90" height="16" rx="4" fill="url(#goldG4)" />
    <!-- Foot Lever System -->
    <path d="M265 220 L380 250 L395 270 L370 275 L265 240 Z" fill="url(#chromeG4)" stroke="#222" />
    <rect x="370" y="255" width="30" height="15" rx="4" fill="#181A1C" stroke="url(#goldG4)" stroke-width="1.5" transform="rotate(15, 370, 255)" />

    <!-- 360 Rotation Arrow Ring -->
    <ellipse cx="240" cy="180" rx="130" ry="25" fill="none" stroke="url(#goldG4)" stroke-width="2" stroke-dasharray="8 6" />
    <polygon points="370,180 360,172 360,188" fill="url(#goldG4)" />
    <polygon points="110,180 120,172 120,188" fill="url(#goldG4)" />
  </g>

  <rect x="0" y="380" width="600" height="70" fill="rgba(15,14,13,0.9)" />
  <text x="30" y="415" font-family="'Cairo', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">هيدروليك وقاعدة فولاذية متينة</text>
  <text x="30" y="435" font-family="'Cairo', sans-serif" font-size="12" font-weight="600" fill="#D4AF37">دوران سلس 360 درجة مع قفل ثبات وتحمل أوزان عالية</text>
</svg>
