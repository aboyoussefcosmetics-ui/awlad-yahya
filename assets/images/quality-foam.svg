<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="qBg3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#282624" />
      <stop offset="100%" stop-color="#121110" />
    </radialGradient>
    <linearGradient id="foamCrossSection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECD499" />
      <stop offset="50%" stop-color="#CBB170" />
      <stop offset="100%" stop-color="#9C8140" />
    </linearGradient>
    <linearGradient id="qGold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8F6C1E" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" rx="12" fill="url(#qBg3)" />

  <!-- Multi-Layer Cushion Cutaway Block (3D Isometric Perspective) -->
  <g transform="translate(60, 60)">
    <!-- Top Leather Layer -->
    <polygon points="190,40 340,90 190,140 40,90" fill="#24211E" stroke="url(#qGold3)" stroke-width="2" />
    <polygon points="40,90 190,140 190,160 40,110" fill="#181614" stroke="#333" />
    <polygon points="190,140 340,90 340,110 190,160" fill="#1F1C19" stroke="#333" />

    <!-- Injected High-Density Foam Block (Golden Sponge Core) -->
    <polygon points="40,110 190,160 190,260 40,210" fill="url(#foamCrossSection)" stroke="#786128" stroke-width="1.5" />
    <polygon points="190,160 340,110 340,210 190,260" fill="#B09653" stroke="#786128" stroke-width="1.5" />

    <!-- Micro Cell Texture in Foam Cutaway -->
    <g fill="#876F32" opacity="0.4">
      <circle cx="70" cy="140" r="3" /> <circle cx="100" cy="150" r="4" /> <circle cx="130" cy="145" r="2.5" />
      <circle cx="80" cy="170" r="3.5" /> <circle cx="110" cy="180" r="2" /> <circle cx="150" cy="175" r="4" />
      <circle cx="65" cy="195" r="4" /> <circle cx="135" cy="205" r="3" /> <circle cx="170" cy="195" r="3.5" />
      <circle cx="220" cy="170" r="3.5" /> <circle cx="260" cy="150" r="2.5" /> <circle cx="300" cy="140" r="4" />
      <circle cx="240" cy="190" r="4" /> <circle cx="280" cy="175" r="3" /> <circle cx="310" cy="165" r="2.5" />
      <circle cx="220" cy="220" r="3" /> <circle cx="270" cy="205" r="3.5" /> <circle cx="320" cy="190" r="4" />
    </g>

    <!-- Heavy Wooden / Steel Bottom Seat Board -->
    <polygon points="40,210 190,260 190,275 40,225" fill="#423526" stroke="#222" />
    <polygon points="190,260 340,210 340,225 190,275" fill="#2E2419" stroke="#222" />

    <!-- Dynamic Compression & Memory Recovery Arrows -->
    <!-- Downward Load Arrow -->
    <path d="M190,10 L190,60" stroke="url(#qGold3)" stroke-width="4" stroke-linecap="round" />
    <polygon points="182,55 190,72 198,55" fill="url(#qGold3)" />
    <text x="190" y="0" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">تحمل ضغط مستمر</text>

    <!-- Foam Rebound / Anti-Sagging Badge -->
    <g transform="translate(230, 200)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#181614" stroke="url(#qGold3)" stroke-width="1.5" />
      <text x="70" y="22" font-family="'Cairo', sans-serif" font-size="10" font-weight="900" fill="url(#qGold3)" text-anchor="middle">إسفنج محقون</text>
      <text x="70" y="38" font-family="'Cairo', sans-serif" font-size="9" font-weight="600" fill="#D0D0D0" text-anchor="middle">كثافة عالية لا تهبط</text>
    </g>
  </g>
</svg>
