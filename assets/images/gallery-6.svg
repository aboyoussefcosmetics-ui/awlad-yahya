<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26231E" />
      <stop offset="100%" stop-color="#12100E" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="10" fill="url(#g6Bg)" />

  <!-- Spa Bed in Relaxing Environment -->
  <g transform="translate(60, 60) scale(0.85)">
    <!-- Base Legs -->
    <rect x="120" y="340" width="260" height="12" rx="3" fill="#D0D0D0" />
    <path d="M150 340 L190 260 L310 260 L350 340" stroke="#888" stroke-width="12" fill="none" stroke-linejoin="round" />
    <!-- 3 Cushion Articulation in Modern White/Off-white with Gold Border -->
    <g transform="translate(60, 160) rotate(-20)">
      <rect x="0" y="0" width="130" height="38" rx="6" fill="#EDE8DF" stroke="#D4AF37" stroke-width="1.8" />
    </g>
    <rect x="175" y="220" width="130" height="38" rx="6" fill="#EDE8DF" stroke="#D4AF37" stroke-width="1.8" />
    <g transform="translate(300, 220) rotate(12)">
      <rect x="0" y="0" width="140" height="38" rx="6" fill="#EDE8DF" stroke="#D4AF37" stroke-width="1.8" />
    </g>
  </g>

  <rect x="0" y="380" width="600" height="70" fill="rgba(15,14,13,0.9)" />
  <text x="30" y="415" font-family="'Cairo', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">شيزلونج تجميل ومساج متعدد الأوضاع</text>
  <text x="30" y="435" font-family="'Cairo', sans-serif" font-size="12" font-weight="600" fill="#D4AF37">تعديل انسيابي للظهر والأرجل مع فتحة تنفس ومساند ذراعين</text>
