<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowKids" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2D211C" />
      <stop offset="100%" stop-color="#120F0D" />
    </radialGradient>
    <linearGradient id="goldKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C7" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8F6C1E" />
    </linearGradient>
    <linearGradient id="chromeKids" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#B5BAC0" />
      <stop offset="100%" stop-color="#5E656C" />
    </linearGradient>
    <radialGradient id="leatherRedKids" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C0392B" />
      <stop offset="65%" stop-color="#962217" />
      <stop offset="100%" stop-color="#5E110A" />
    </radialGradient>
    <radialGradient id="cushionBlackKids" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3A3836" />
      <stop offset="60%" stop-color="#22201E" />
      <stop offset="100%" stop-color="#141211" />
    </radialGradient>
  </defs>

  <rect width="600" height="500" rx="16" fill="url(#bgGlowKids)" />
  <ellipse cx="300" cy="455" rx="180" ry="22" fill="#000000" opacity="0.8" />

  <!-- Base & Hydraulic System with Safety Lock -->
  <ellipse cx="300" cy="440" rx="120" ry="24" fill="url(#chromeKids)" stroke="#111" stroke-width="1.5" />
  <ellipse cx="300" cy="435" rx="108" ry="18" fill="#1C1A18" />
  <rect x="284" y="340" width="32" height="95" fill="url(#chromeKids)" stroke="#333" />
  <rect x="278" y="420" width="44" height="10" rx="2" fill="url(#goldKids)" />

  <!-- Foot Pump Pedal with Anti-Slip Grip -->
  <path d="M316 400 L370 420 L380 432 L360 436 L316 410 Z" fill="url(#chromeKids)" />
  <rect x="360" y="422" width="22" height="8" rx="2" fill="#111" />

  <!-- Children Footrest Assembly (Height-Optimized with Safety Plate) -->
  <path d="M255 345 L200 410 L250 435 L265 420 L220 405 L265 355 Z" fill="url(#chromeKids)" />
  <polygon points="170,418 250,418 235,442 155,442" fill="url(#chromeKids)" stroke="#222" />
  <polygon points="175,420 245,420 232,440 162,440" fill="#202020" />
  <line x1="172" y1="428" x2="238" y2="428" stroke="url(#goldKids)" stroke-width="2" />
  <line x1="166" y1="434" x2="230" y2="434" stroke="url(#goldKids)" stroke-width="2" />

  <!-- Main Chair Seat Shell in Vibrant Salon Racing Red -->
  <path d="M200 290 C200 270, 225 265, 300 265 C375 265, 400 270, 400 290 L395 340 C395 355, 375 360, 300 360 C225 360, 205 355, 205 340 Z" fill="url(#leatherRedKids)" stroke="#4A0D07" stroke-width="2" />

  <!-- Contrast Padded Booster Insert Cushion -->
  <ellipse cx="300" cy="320" rx="76" ry="24" fill="url(#cushionBlackKids)" stroke="url(#goldKids)" stroke-width="1.5" />
  <circle cx="265" cy="320" r="3.5" fill="url(#goldKids)" />
  <circle cx="300" cy="321" r="4" fill="url(#goldKids)" />
  <circle cx="335" cy="320" r="3.5" fill="url(#goldKids)" />

  <!-- Ergonomic High Backrest with Lateral Head & Shoulder Protection -->
  <path d="M215 150 C225 135, 375 135, 385 150 L390 285 C390 295, 210 295, 210 285 Z" fill="url(#leatherRedKids)" stroke="url(#goldKids)" stroke-width="2" />

  <!-- Vertical Quilted Backrest Padding -->
  <line x1="250" y1="160" x2="250" y2="275" stroke="#7A180F" stroke-width="2" />
  <line x1="275" y1="155" x2="275" y2="278" stroke="#7A180F" stroke-width="2" />
  <line x1="300" y1="153" x2="300" y2="280" stroke="url(#goldKids)" stroke-width="2" />
  <line x1="325" y1="155" x2="325" y2="278" stroke="#7A180F" stroke-width="2" />
  <line x1="350" y1="160" x2="350" y2="275" stroke="#7A180F" stroke-width="2" />

  <!-- Adjustable Padded Safety Headrest -->
  <rect x="292" y="110" width="16" height="30" fill="url(#chromeKids)" />
  <rect x="250" y="80" width="100" height="36" rx="8" fill="url(#leatherRedKids)" stroke="url(#goldKids)" stroke-width="1.5" />
  <circle cx="300" cy="98" r="3.5" fill="url(#goldKids)" />

  <!-- Safety Harness Belt (3-Point Buckle across Seat for Child Safety) -->
  <path d="M240 230 L300 295 L360 230" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="300" cy="295" r="9" fill="url(#chromeKids)" stroke="#111" stroke-width="1.5" />
  <circle cx="300" cy="295" r="4" fill="url(#goldKids)" />

  <!-- Enclosed Safe Chromed Armrests with Rounded Edges -->
  <path d="M185 320 C175 315, 172 250, 180 220 C185 208, 205 208, 215 215 L218 230 C206 226, 196 228, 194 240 C190 262, 196 305, 204 315 Z" fill="url(#chromeKids)" stroke="#222" />
  <rect x="180" y="215" width="40" height="12" rx="4" fill="url(#leatherRedKids)" stroke="url(#goldKids)" stroke-width="1" />

  <path d="M415 320 C425 315, 428 250, 420 220 C415 208, 395 208, 385 215 L382 230 C394 226, 404 228, 406 240 C410 262, 404 305, 396 315 Z" fill="url(#chromeKids)" stroke="#222" />
  <rect x="380" y="215" width="40" height="12" rx="4" fill="url(#leatherRedKids)" stroke="url(#goldKids)" stroke-width="1" />

  <!-- Playful Steering Wheel Accessory Bar for Kids Engagement -->
  <path d="M270 250 L270 235 M330 250 L330 235" stroke="url(#chromeKids)" stroke-width="4" stroke-linecap="round" />
  <ellipse cx="300" cy="230" rx="30" ry="12" fill="none" stroke="url(#goldKids)" stroke-width="4" transform="rotate(-10, 300, 230)" />
  <circle cx="300" cy="230" r="5" fill="url(#chromeKids)" />

  <!-- Category Badge / Tag -->
  <rect x="20" y="20" width="135" height="32" rx="6" fill="#1B1B1B" stroke="url(#goldKids)" stroke-width="1" />
  <text x="87" y="41" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">كراسي أطفال</text>
</svg>
