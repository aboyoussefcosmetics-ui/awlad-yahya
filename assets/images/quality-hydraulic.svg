<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="qBg1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#262A2E" />
      <stop offset="100%" stop-color="#111315" />
    </radialGradient>
    <linearGradient id="qChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#B2B8BE" />
      <stop offset="70%" stop-color="#60666D" />
      <stop offset="100%" stop-color="#9EABB6" />
    </linearGradient>
    <linearGradient id="qGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#916F20" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" rx="12" fill="url(#qBg1)" />

  <!-- Macro Technical Blueprint Grid Lines -->
  <g stroke="#262C32" stroke-width="1" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="0" y1="80" x2="500" y2="80" />
    <line x1="0" y1="160" x2="500" y2="160" />
    <line x1="0" y1="240" x2="500" y2="240" />
    <line x1="0" y1="320" x2="500" y2="320" />
  </g>

  <!-- Large Macro Cutaway of Heavy Steel Hydraulic Cylinder -->
  <!-- Outer Cast Casing -->
  <rect x="180" y="80" width="140" height="240" rx="10" fill="url(#qChrome)" stroke="#111" stroke-width="2" />
  <!-- Inner Honed Steel Cylinder Chamber -->
  <rect x="200" y="100" width="100" height="200" rx="4" fill="#1C1F24" />
  <rect x="210" y="100" width="80" height="200" fill="#252A30" />
  <!-- High Pressure Piston Shaft -->
  <rect x="225" y="40" width="50" height="150" fill="url(#qChrome)" stroke="#222" stroke-width="1.5" />
  <line x1="235" y1="40" x2="235" y2="190" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
  <!-- High Performance Double Pressure Seals (Gold) -->
  <rect x="220" y="160" width="60" height="16" rx="3" fill="url(#qGold)" />
  <rect x="220" y="184" width="60" height="12" rx="3" fill="url(#qGold)" />

  <!-- Base Flange with Heavy Bolts -->
  <rect x="160" y="310" width="180" height="25" rx="5" fill="url(#qChrome)" stroke="#111" />
  <circle cx="180" cy="322" r="6" fill="#222" stroke="url(#qGold)" stroke-width="1.5" />
  <circle cx="215" cy="322" r="6" fill="#222" stroke="url(#qGold)" stroke-width="1.5" />
  <circle cx="285" cy="322" r="6" fill="#222" stroke="url(#qGold)" stroke-width="1.5" />
  <circle cx="320" cy="322" r="6" fill="#222" stroke="url(#qGold)" stroke-width="1.5" />

  <!-- Technical Spec Callout Labels -->
  <line x1="275" y1="70" x2="380" y2="70" stroke="url(#qGold)" stroke-width="1.5" />
  <circle cx="275" cy="70" r="3" fill="url(#qGold)" />
  <text x="390" y="74" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">عمود فولاذ صلب معالج</text>

  <line x1="280" y1="170" x2="380" y2="170" stroke="url(#qGold)" stroke-width="1.5" />
  <circle cx="280" cy="170" r="3" fill="url(#qGold)" />
  <text x="390" y="174" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">صمامات ضغط مزدوجة</text>

  <line x1="320" y1="322" x2="380" y2="322" stroke="url(#qGold)" stroke-width="1.5" />
  <circle cx="320" cy="322" r="3" fill="url(#qGold)" />
  <text x="390" y="326" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">قاعدة تثبيت فائقة المتانة</text>
</svg>
