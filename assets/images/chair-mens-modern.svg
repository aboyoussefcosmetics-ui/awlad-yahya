<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#24282B" />
      <stop offset="100%" stop-color="#121415" />
    </radialGradient>
    <linearGradient id="silverAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C0C7CE" />
      <stop offset="100%" stop-color="#6F7982" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B83A3A" />
      <stop offset="100%" stop-color="#852222" />
    </linearGradient>
    <radialGradient id="leatherGraphite" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#36393E" />
      <stop offset="70%" stop-color="#202226" />
      <stop offset="100%" stop-color="#141517" />
    </radialGradient>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgGlow2)" />
  <ellipse cx="300" cy="450" rx="190" ry="22" fill="#000000" opacity="0.8" />

  <!-- Square Modern Brushed Base -->
  <polygon points="180,440 420,440 440,420 160,420" fill="url(#silverAccent)" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="190,436 410,436 430,422 170,422" fill="#1C1E22" />
  <rect x="280" y="340" width="40" height="85" fill="url(#silverAccent)" />
  <!-- Modern Geometric Foot Pedal -->
  <path d="M320 400 L385 418 L380 430 L320 410 Z" fill="url(#silverAccent)" />
  <rect x="360" y="415" width="28" height="10" rx="2" fill="#2B303A" />

  <!-- Modern Integrated Footrest -->
  <path d="M260 330 L200 400 L160 410 L165 425 L215 415 L275 340 Z" fill="url(#silverAccent)" />
  <rect x="150" y="410" width="80" height="24" rx="4" fill="#1E2024" stroke="url(#silverAccent)" stroke-width="1.5" />
  <line x1="160" y1="422" x2="220" y2="422" stroke="url(#silverAccent)" stroke-width="2" />

  <!-- Ergonomic Sculpted Bucket Seat -->
  <path d="M205 290 C205 275, 230 270, 300 270 C370 270, 395 275, 395 290 L390 330 C390 340, 370 345, 300 345 C230 345, 210 340, 210 330 Z" fill="url(#leatherGraphite)" stroke="#16181B" stroke-width="2" />
  <!-- Red Contrast Sports Stitching -->
  <path d="M220 300 C250 310, 350 310, 380 300" stroke="url(#redAccent)" stroke-width="2" stroke-dasharray="6 3" fill="none" />

  <!-- Backrest with Lateral Bolsters -->
  <path d="M220 150 C230 140, 370 140, 380 150 L390 285 C390 295, 210 295, 210 285 Z" fill="url(#leatherGraphite)" stroke="#141517" stroke-width="2" />
  <!-- Side Bolster Accent Lines -->
  <path d="M240 155 L230 285" stroke="url(#redAccent)" stroke-width="2" />
  <path d="M360 155 L370 285" stroke="url(#redAccent)" stroke-width="2" />
  <!-- Modern Horizontal Segment Stitching -->
  <line x1="245" y1="180" x2="355" y2="180" stroke="#4A5057" stroke-width="2" />
  <line x1="242" y1="215" x2="358" y2="215" stroke="#4A5057" stroke-width="2" />
  <line x1="240" y1="250" x2="360" y2="250" stroke="#4A5057" stroke-width="2" />

  <!-- Sleek Headrest -->
  <rect x="290" y="115" width="20" height="28" fill="url(#silverAccent)" />
  <rect x="245" y="85" width="110" height="35" rx="6" fill="url(#leatherGraphite)" stroke="url(#silverAccent)" stroke-width="1.5" />
  <line x1="255" y1="102" x2="345" y2="102" stroke="url(#redAccent)" stroke-width="1.5" />

  <!-- Streamlined Solid Armrests -->
  <path d="M190 220 L215 220 L210 320 L195 320 C185 320, 180 230, 190 220 Z" fill="url(#silverAccent)" stroke="#111" />
  <path d="M410 220 L385 220 L390 320 L405 320 C415 320, 420 230, 410 220 Z" fill="url(#silverAccent)" stroke="#111" />
  <rect x="185" y="215" width="35" height="10" rx="3" fill="#1C1E22" />
  <rect x="380" y="215" width="35" height="10" rx="3" fill="#1C1E22" />

  <!-- Badge / Tag -->
  <rect x="20" y="20" width="165" height="32" rx="6" fill="#1B1B1B" stroke="url(#silverAccent)" stroke-width="1" />
  <text x="102" y="41" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">موديل عصري — ماستر برو</text>
</svg>
