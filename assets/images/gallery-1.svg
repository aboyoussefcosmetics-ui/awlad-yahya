      <stop offset="0%" stop-color="#241E17" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>
    <linearGradient id="g1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3B5" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#916F20" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="10" fill="url(#g1Bg)" />
  <!-- Barber shop interior with mirrored stations and chairs in row -->
  <g opacity="0.3">
