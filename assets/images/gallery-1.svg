    <rect x="240" y="40" width="120" height="220" rx="6" fill="#1A1817" stroke="url(#g1Gold)" stroke-width="1.5" />
    <rect x="430" y="40" width="120" height="220" rx="6" fill="#1A1817" stroke="url(#g1Gold)" stroke-width="1.5" />
    <!-- Floor tiles -->
    <path d="M0 340 L600 340" stroke="#333" stroke-width="2" />
  </g>
  <!-- Foreground Luxury Barber Chair Silhouette & Gold Details -->
  <g transform="translate(190, 80) scale(0.7)">
    <ellipse cx="160" cy="420" rx="120" ry="24" fill="#D4AF37" opacity="0.9" />
    <rect x="145" y="320" width="30" height="95" fill="#EAEAEA" />
    <path d="M70 260 L250 260 L240 310 L80 310 Z" fill="#1F1D1A" stroke="#D4AF37" stroke-width="2" />
    <rect x="90" y="140" width="140" height="120" rx="10" fill="#181614" stroke="#D4AF37" stroke-width="2" />
    <rect x="125" y="90" width="70" height="30" rx="6" fill="#181614" stroke="#D4AF37" stroke-width="1.5" />
  </g>
  <rect x="0" y="380" width="600" height="70" fill="rgba(15,14,13,0.9)" />
  <text x="30" y="415" font-family="'Cairo', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">تجهيز صالون رجالي متكامل</text>
  <text x="30" y="435" font-family="'Cairo', sans-serif" font-size="12" font-weight="600" fill="#D4AF37">كراسي حلاقة رويال — أسود وفولاذ مطلي</text>
