<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Upscale Barber Salon Atmosphere -->
    <radialGradient id="heroBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D2419" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#1A1817" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D0D0E" stop-opacity="1" />
    </radialGradient>

    <!-- Metallic Gold / Brass Gradients -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#9C7723" />
      <stop offset="85%" stop-color="#DEBA51" />
      <stop offset="100%" stop-color="#735411" />
    </linearGradient>

    <!-- Chrome / Steel Metal Gradients -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAEAEA" />
      <stop offset="20%" stop-color="#B0B0B0" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#707070" />
      <stop offset="88%" stop-color="#DCDCDC" />
      <stop offset="100%" stop-color="#484848" />
    </linearGradient>

    <linearGradient id="chromeVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#BFBFBF" />
      <stop offset="70%" stop-color="#6B6B6B" />
      <stop offset="100%" stop-color="#2E2E2E" />
    </linearGradient>

    <!-- Premium Tufted Black / Cognac Leather Gradients -->
    <radialGradient id="leatherCushion" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#343231" />
      <stop offset="50%" stop-color="#22201F" />
      <stop offset="85%" stop-color="#151413" />
      <stop offset="100%" stop-color="#0B0B0A" />
    </radialGradient>

    <radialGradient id="leatherBackrest" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3A3735" />
      <stop offset="60%" stop-color="#211F1E" />
      <stop offset="100%" stop-color="#0E0D0D" />
    </radialGradient>

    <!-- Ground Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="18" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.75" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cushionGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Environment: Stylized Luxury Salon Interior -->
  <rect width="900" height="700" fill="url(#heroBgGlow)" />

  <!-- Salon Arch & Back Wall Lighting Detail -->
  <g opacity="0.35">
    <ellipse cx="450" cy="180" rx="360" ry="240" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
    <path d="M120 70 L780 70" stroke="#C5A059" stroke-width="1" opacity="0.3" />
    <path d="M180 0 L180 700 M720 0 L720 700" stroke="#FFFFFF" stroke-width="0.75" opacity="0.08" />
    <!-- Vertical warm accent pillars -->
    <rect x="190" y="80" width="4" height="420" fill="url(#goldHighlight)" opacity="0.3" />
    <rect x="706" y="80" width="4" height="420" fill="url(#goldHighlight)" opacity="0.3" />
  </g>

  <!-- Ground Floor & Perspective Reflections -->
  <path d="M0 550 L900 550 L900 700 L0 700 Z" fill="#0D0D0E" />
  <line x1="0" y1="550" x2="900" y2="550" stroke="#3A342B" stroke-width="2" opacity="0.6" />

  <!-- Deep Floor Shadow Under Chair Base -->
  <ellipse cx="450" cy="620" rx="260" ry="42" fill="#000000" opacity="0.85" filter="url(#shadowFilter)" />
  <ellipse cx="450" cy="625" rx="190" ry="26" fill="#000000" opacity="0.95" />

  <!-- MAIN CHAIR OBJECT -->
  <g id="masterBarberChair" transform="translate(0, -10)">
    
    <!-- 1. CHAIR BASE & HYDRAULIC SYSTEM -->
    <!-- Heavy Chrome Cast Round Disc Base -->
    <g id="baseAssembly">
      <!-- Outer Base Ring -->
      <ellipse cx="450" cy="610" rx="175" ry="34" fill="url(#chromeGrad)" stroke="#111" stroke-width="2" />
      <ellipse cx="450" cy="606" rx="168" ry="30" fill="url(#chromeVertical)" />
      <ellipse cx="450" cy="603" rx="155" ry="26" fill="#1C1C1C" />
      <ellipse cx="450" cy="600" rx="145" ry="23" fill="url(#chromeGrad)" />

      <!-- Chrome Base Outer Rim Highlights -->
      <path d="M280 610 C320 635, 580 635, 620 610" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.7" />
      <path d="M300 614 C360 638, 540 638, 600 614" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6" />

      <!-- Center Hydraulic Cylinder Housing -->
      <path d="M420 598 L420 480 L480 480 L480 598 Z" fill="url(#chromeGrad)" stroke="#222" stroke-width="1.5" />
      <!-- Chrome Collar -->
      <rect x="414" y="582" width="72" height="12" rx="4" fill="url(#goldHighlight)" />
      <!-- Inner Hydraulic Telescoping Shaft -->
      <rect x="428" y="440" width="44" height="60" fill="url(#chromeGrad)" />
      <line x1="438" y1="440" x2="438" y2="500" stroke="#FFFFFF" stroke-width="3" opacity="0.75" />

      <!-- Foot Pump Recline Lever (Pedal) -->
      <path d="M472 540 L560 565 L575 585 L565 590 L548 572 L472 552 Z" fill="url(#chromeGrad)" stroke="#111" stroke-width="1" />
      <rect x="555" y="575" width="28" height="14" rx="3" fill="#181818" stroke="url(#goldHighlight)" stroke-width="1.5" transform="rotate(15, 555, 575)" />
    </g>

    <!-- 2. FOOTREST & LEG SUPPORT ASSEMBLY -->
    <g id="footrestAssembly">
      <!-- Dual Chrome Support Struts -->
      <path d="M380 470 L300 550 L270 575 L285 585 L320 555 L395 470 Z" fill="url(#chromeGrad)" />
      <path d="M420 470 L345 550 L320 575 L335 585 L365 555 L435 470 Z" fill="url(#chromeGrad)" />
      <!-- Polished Foot Plate with Diamond Grip Pattern -->
      <polygon points="250,565 375,565 350,600 220,600" fill="url(#chromeGrad)" stroke="#333" stroke-width="2" />
      <polygon points="255,568 368,568 345,595 230,595" fill="#1F1F1F" />
      <!-- Grip Ribs -->
      <line x1="260" y1="575" x2="350" y2="575" stroke="url(#goldHighlight)" stroke-width="2" />
      <line x1="250" y1="582" x2="340" y2="582" stroke="url(#goldHighlight)" stroke-width="2" />
      <line x1="240" y1="589" x2="330" y2="589" stroke="url(#goldHighlight)" stroke-width="2" />
      <!-- Awlad Yahya Engraving on Footrest -->
      <text x="290" y="585" font-family="'Montserrat', sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" opacity="0.8" text-anchor="middle" letter-spacing="1">AWLAD YAHYA</text>
      <!-- Calf Rest Padded Panel -->
      <rect x="295" y="505" width="95" height="42" rx="8" fill="url(#leatherCushion)" stroke="url(#goldHighlight)" stroke-width="1.5" transform="rotate(-30, 295, 505)" />
      <circle cx="340" cy="510" r="2.5" fill="url(#goldHighlight)" />
      <circle cx="370" cy="527" r="2.5" fill="url(#goldHighlight)" />
    </g>

    <!-- 3. SEAT SUB-FRAME & SEAT CUSHION -->
    <g id="seatAssembly" filter="url(#cushionGlow)">
      <!-- Heavy Cast Aluminum Sub-Frame with Gold Plated Trim -->
      <path d="M330 440 L570 440 C585 440, 595 450, 590 465 L575 480 C570 488, 330 488, 325 480 L310 465 C305 450, 315 440, 330 440 Z" fill="url(#chromeGrad)" stroke="#111" stroke-width="2" />
      <path d="M332 462 L568 462" stroke="url(#goldHighlight)" stroke-width="3" stroke-linecap="round" />

      <!-- Thick Padded High-Density Seat Cushion -->
      <path d="M320 405 C320 395, 340 390, 450 390 C560 390, 580 395, 580 405 L585 445 C585 455, 560 460, 450 460 C340 460, 315 455, 315 445 Z" fill="url(#leatherCushion)" stroke="#1A1817" stroke-width="2" />

      <!-- Leather Tufting & Stitching Details on Seat -->
      <path d="M340 425 C380 435, 520 435, 560 425" stroke="#4A4744" stroke-width="1.5" stroke-dasharray="5 3" fill="none" />
      <path d="M355 410 C390 445, 510 445, 545 410" stroke="#3A3836" stroke-width="1.5" fill="none" opacity="0.6" />
      <!-- Golden Tuft Buttons -->
      <circle cx="390" cy="425" r="4" fill="url(#goldHighlight)" />
      <circle cx="450" cy="427" r="4.5" fill="url(#goldHighlight)" />
      <circle cx="510" cy="425" r="4" fill="url(#goldHighlight)" />

      <!-- Leather Sheen Highlights -->
      <path d="M350 402 C410 396, 490 396, 550 402" stroke="#FFFFFF" stroke-width="2.5" opacity="0.25" stroke-linecap="round" />
    </g>

    <!-- 4. BACKREST & RECLINE MECHANISM -->
    <g id="backrestAssembly">
      <!-- Steel Recline Joint Brackets -->
      <path d="M545 425 L585 415 L590 320 L555 330 Z" fill="url(#chromeGrad)" stroke="#111" stroke-width="1.5" />
      <path d="M355 425 L315 415 L310 320 L345 330 Z" fill="url(#chromeGrad)" stroke="#111" stroke-width="1.5" />
      <circle cx="570" cy="415" r="7" fill="url(#goldHighlight)" stroke="#222" stroke-width="1.5" />
      <circle cx="330" cy="415" r="7" fill="url(#goldHighlight)" stroke="#222" stroke-width="1.5" />

      <!-- Solid Backrest Cushion -->
      <path d="M350 200 C360 190, 540 190, 550 200 L565 390 C565 400, 335 400, 335 390 Z" fill="url(#leatherBackrest)" stroke="#161514" stroke-width="2" />

      <!-- Outer Gold Metal Piping & Shell -->
      <path d="M346 202 C356 188, 544 188, 554 202 L568 392" fill="none" stroke="url(#goldHighlight)" stroke-width="2.5" />
      <path d="M332 392 L346 202" fill="none" stroke="url(#goldHighlight)" stroke-width="2.5" />

      <!-- Diamond Tufted Luxury Backrest Pattern (Classic Chesterfield Style) -->
      <g stroke="#3E3A36" stroke-width="1.5" opacity="0.85">
        <line x1="390" y1="215" x2="510" y2="305" />
        <line x1="510" y1="215" x2="390" y2="305" />
        <line x1="365" y1="260" x2="535" y2="385" />
        <line x1="535" y1="260" x2="365" y2="385" />
        <line x1="410" y1="310" x2="490" y2="370" />
        <line x1="490" y1="310" x2="410" y2="370" />
      </g>

      <!-- Deep Diamond Tuft Buttons (Gold Accent) -->
      <circle cx="450" cy="260" r="5" fill="url(#goldHighlight)" filter="url(#cushionGlow)" />
      <circle cx="400" cy="305" r="4.5" fill="url(#goldHighlight)" />
      <circle cx="500" cy="305" r="4.5" fill="url(#goldHighlight)" />
      <circle cx="450" cy="350" r="5" fill="url(#goldHighlight)" filter="url(#cushionGlow)" />
      <circle cx="375" cy="350" r="4" fill="url(#goldHighlight)" />
      <circle cx="525" cy="350" r="4" fill="url(#goldHighlight)" />

      <!-- Factory Brand Crest Plaque on Backrest Top -->
      <rect x="420" y="202" width="60" height="18" rx="4" fill="url(#goldHighlight)" stroke="#222" stroke-width="1" />
      <text x="450" y="214" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#111111" text-anchor="middle">أولاد يحيى</text>
    </g>

    <!-- 5. ADJUSTABLE HEADREST -->
    <g id="headrestAssembly">
      <!-- Twin Steel Support Rods -->
      <rect x="432" y="165" width="7" height="36" fill="url(#chromeGrad)" stroke="#111" stroke-width="1" />
      <rect x="461" y="165" width="7" height="36" fill="url(#chromeGrad)" stroke="#111" stroke-width="1" />
      <!-- Ergonomic Headrest Cushion -->
      <rect x="385" y="130" width="130" height="42" rx="10" fill="url(#leatherBackrest)" stroke="#161514" stroke-width="2" />
      <!-- Headrest Gold Bezel Trim -->
      <rect x="388" y="133" width="124" height="36" rx="8" fill="none" stroke="url(#goldHighlight)" stroke-width="1.8" />
      <!-- Stitching Line -->
      <line x1="395" y1="151" x2="505" y2="151" stroke="#3D3A37" stroke-width="1.5" stroke-dasharray="4 2" />
      <circle cx="450" cy="151" r="3" fill="url(#goldHighlight)" />
    </g>

    <!-- 6. SCULPTED CHROMED ARMRESTS WITH PADDED TOPS -->
    <g id="armrestAssembly">
      <!-- Right Armrest (Viewer's Left) -->
      <g>
        <!-- Curved Chrome Bracket -->
        <path d="M295 440 C280 435, 275 360, 280 320 C283 295, 305 295, 325 300 L335 320 C320 318, 305 318, 303 335 C298 365, 305 425, 318 435 Z" fill="url(#chromeGrad)" stroke="#111" stroke-width="1.5" />
        <!-- Top Arm Cushion Pad -->
        <path d="M285 305 C285 298, 300 295, 335 295 L345 322 C320 322, 290 320, 285 305 Z" fill="url(#leatherCushion)" stroke="url(#goldHighlight)" stroke-width="1.5" />
        <!-- Towel Hanging Hook (Classic Barber Chair Feature) -->
        <path d="M276 345 C265 345, 260 365, 272 375 C278 375, 280 365, 278 355" fill="none" stroke="url(#goldHighlight)" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Left Armrest (Viewer's Right) with Recline Lever -->
      <g>
        <!-- Curved Chrome Bracket -->
        <path d="M605 440 C620 435, 625 360, 620 320 C617 295, 595 295, 575 300 L565 320 C580 318, 595 318, 597 335 C602 365, 595 425, 582 435 Z" fill="url(#chromeGrad)" stroke="#111" stroke-width="1.5" />
        <!-- Top Arm Cushion Pad -->
        <path d="M615 305 C615 298, 600 295, 565 295 L555 322 C580 322, 610 320, 615 305 Z" fill="url(#leatherCushion)" stroke="url(#goldHighlight)" stroke-width="1.5" />
        <!-- Hand Recline Release Lever with Ball Grip -->
        <path d="M615 350 L645 330" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="648" cy="328" r="7" fill="url(#goldHighlight)" stroke="#111" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- High-end Lighting Vignette & Floating Quality Sparks/Badges -->
  <g opacity="0.9">
    <!-- Factory Seal Stamp Floating in Top Corner -->
    <g transform="translate(730, 45)">
      <circle cx="50" cy="50" r="42" fill="#141414" stroke="url(#goldHighlight)" stroke-width="2" />
      <circle cx="50" cy="50" r="37" fill="none" stroke="url(#goldHighlight)" stroke-width="1" stroke-dasharray="3 2" />
      <path d="M50 18 L53 26 L61 26 L55 31 L57 39 L50 34 L43 39 L45 31 L39 26 L47 26 Z" fill="url(#goldHighlight)" />
      <text x="50" y="52" font-family="'Cairo', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">مصنع متخصص</text>
      <text x="50" y="66" font-family="'Cairo', sans-serif" font-size="8" font-weight="700" fill="url(#goldHighlight)" text-anchor="middle">جودة &amp; متانة</text>
    </g>

    <!-- Hydraulic Guarantee Spec Badge in Lower Left -->
    <g transform="translate(60, 460)">
      <rect x="0" y="0" width="165" height="60" rx="8" fill="#181818" stroke="url(#goldHighlight)" stroke-width="1.2" opacity="0.9" />
      <circle cx="28" cy="30" r="16" fill="#252525" stroke="url(#goldHighlight)" stroke-width="1.5" />
      <!-- Hydraulic Icon -->
      <path d="M28 20 L28 40 M22 26 L28 20 L34 26 M22 34 L28 40 L34 34" stroke="url(#goldHighlight)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="54" y="26" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">هيدروليك فولاذي</text>
      <text x="54" y="44" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="600" fill="#AAAAAA">دوران سلس وتحمل فائق</text>
    </g>
  </g>
</svg>
