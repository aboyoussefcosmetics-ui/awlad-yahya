<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7BE" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA822A" />
      <stop offset="100%" stop-color="#E5C76B" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Stylized Luxury Barber Chair Silhouette in Shield -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal Crest Background -->
    <polygon points="50,0 95,25 95,75 50,100 5,75 5,25" fill="url(#metalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="50,6 89,28 89,72 50,94 11,72 11,28" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 2" opacity="0.6" />

    <!-- Chair Silhouette & Monogram -->
    <!-- Headrest -->
    <rect x="38" y="20" width="24" height="6" rx="3" fill="url(#goldGrad)" />
    <path d="M47 26 L47 31 M53 26 L53 31" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Backrest -->
    <path d="M30 31 C30 30, 70 30, 70 31 L68 53 C68 56, 32 56, 32 53 Z" fill="url(#goldGrad)" />
    <!-- Armrests -->
    <path d="M24 40 L28 40 L28 58 L23 58 C21 58, 21 40, 24 40 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <path d="M76 40 L72 40 L72 58 L77 58 C79 58, 79 40, 76 40 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <!-- Seat Cushion -->
    <rect x="25" y="55" width="50" height="9" rx="3" fill="#FFFFFF" />
    <!-- Hydraulic Pump Column -->
    <rect x="46" y="64" width="8" height="15" fill="url(#goldGrad)" />
    <rect x="44" y="70" width="12" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <!-- Footrest Lever -->
    <path d="M42 75 L30 82" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Heavy Round Base -->
    <ellipse cx="50" cy="81" rx="28" ry="6" fill="url(#goldGrad)" />
    <ellipse cx="50" cy="80" rx="20" ry="3" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Typography Text (Right aligned for RTL context or balanced bilingual) -->
  <g transform="translate(130, 0)">
    <!-- Arabic Main Factory Name -->
    <text x="0" y="44" font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" font-size="27" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      مصنع <tspan fill="url(#goldGrad)">أولاد يحيى</tspan>
    </text>
    <!-- Arabic Subtitle / Specialization -->
    <text x="0" y="72" font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#CCCCCC" letter-spacing="0.2">
      لتصنيع كراسي الحلاقة ومعدات صالونات التجميل
    </text>
    <!-- English Sub-brand / Badge -->
    <text x="0" y="96" font-family="'Montserrat', 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="2.5">
      AWLAD YAHYA <tspan fill="#888888" font-weight="500" letter-spacing="1">| FACTORY &amp; SUPPLIER</tspan>
    </text>
  </g>
</svg>
