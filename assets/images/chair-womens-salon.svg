<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2D2024" />
      <stop offset="100%" stop-color="#141112" />
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD0C4" />
      <stop offset="40%" stop-color="#E8A598" />
      <stop offset="100%" stop-color="#A25D52" />
    </linearGradient>
    <linearGradient id="chrome4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C2C2C2" />
      <stop offset="100%" stop-color="#6E6E6E" />
    </linearGradient>
    <radialGradient id="velvetCream" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#403A3C" />
      <stop offset="60%" stop-color="#282325" />
      <stop offset="100%" stop-color="#181516" />
    </radialGradient>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgGlow4)" />
  <ellipse cx="300" cy="450" rx="170" ry="20" fill="#000000" opacity="0.7" />

  <!-- Elegant Chrome Flat Square Base -->
  <polygon points="180,440 420,440 450,420 150,420" fill="url(#chrome4)" stroke="#222" stroke-width="1.5" />
  <polygon points="190,436 410,436 438,423 162,423" fill="#1F1B1D" />
  <!-- Hydraulic Column -->
  <rect x="285" y="330" width="30" height="100" fill="url(#chrome4)" />
  <!-- Hydraulic Foot Pedal -->
  <path d="M315 390 L365 410 L372 420 L350 423 L315 400 Z" fill="url(#chrome4)" />

  <!-- Graceful Rounded Curved Tub/Bucket Styling Chair -->
  <!-- Outer Shell in Dark Velvet / Leather -->
  <path d="M190 220 C180 330, 200 345, 300 345 C400 345, 420 330, 410 220 C405 170, 370 160, 300 160 C230 160, 195 170, 190 220 Z" fill="url(#velvetCream)" stroke="#111" stroke-width="2" />

  <!-- Rose Gold / Metallic Trim Edge -->
  <path d="M190 220 C180 330, 200 345, 300 345 C400 345, 420 330, 410 220" fill="none" stroke="url(#roseGold)" stroke-width="2.5" />

  <!-- Plush Thick Seat Cushion -->
  <ellipse cx="300" cy="305" rx="85" ry="32" fill="#241E20" stroke="url(#roseGold)" stroke-width="1.5" />
  <ellipse cx="300" cy="302" rx="72" ry="24" fill="#362E31" />

  <!-- Soft Backrest Padding with Vertical Fluted Stitching -->
  <path d="M225 180 C235 172, 365 172, 375 180 L365 285 C345 295, 255 295, 235 285 Z" fill="#2B2527" />
  <!-- Fluting Stitch Lines -->
  <path d="M255 178 L258 285" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.7" />
  <path d="M280 174 L282 288" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.7" />
  <path d="M300 173 L300 289" stroke="url(#roseGold)" stroke-width="2" opacity="0.9" />
  <path d="M320 174 L318 288" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.7" />
  <path d="M345 178 L342 285" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.7" />

  <!-- Integrated Curved Armrests Contour -->
  <path d="M192 225 C200 270, 220 285, 240 290" fill="none" stroke="#504548" stroke-width="3" />
  <path d="M408 225 C400 270, 380 285, 360 290" fill="none" stroke="#504548" stroke-width="3" />

  <!-- Footrest Option (Minimalist Chrome T-Bar) -->
  <rect x="296" y="345" width="8" height="60" fill="url(#chrome4)" />
  <rect x="235" y="405" width="130" height="8" rx="4" fill="url(#chrome4)" />

  <!-- Badge / Tag -->
  <rect x="20" y="20" width="165" height="32" rx="6" fill="#1B1B1B" stroke="url(#roseGold)" stroke-width="1" />
  <text x="102" y="41" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">كراسي حلاقة وكوافير</text>
</svg>
