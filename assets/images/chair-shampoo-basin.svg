<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow6" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E272E" />
      <stop offset="100%" stop-color="#0F1418" />
    </radialGradient>
    <linearGradient id="ceramicWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E5E9EC" />
      <stop offset="100%" stop-color="#B8C2C9" />
    </linearGradient>
    <linearGradient id="blackBasinBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3339" />
      <stop offset="100%" stop-color="#16191C" />
    </linearGradient>
    <linearGradient id="chrome6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A5ACB2" />
      <stop offset="100%" stop-color="#5B6369" />
    </linearGradient>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3B5" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#916F20" />
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgGlow6)" />
  <ellipse cx="300" cy="455" rx="230" ry="24" fill="#000000" opacity="0.8" />

  <!-- Rear Basin Pedestal Cabinet (Black Fiberglass/Steel) -->
  <path d="M120 220 L210 220 L230 440 L100 440 Z" fill="url(#blackBasinBody)" stroke="#111" stroke-width="2" />
  <!-- Service Hatch Door Lines -->
  <line x1="125" y1="280" x2="125" y2="420" stroke="#373E45" stroke-width="2" />
  <line x1="125" y1="420" x2="210" y2="420" stroke="#373E45" stroke-width="2" />

  <!-- Ergonomic Tilting Ceramic Wash Basin -->
  <path d="M75 160 C75 130, 100 120, 160 120 C220 120, 245 130, 245 160 C245 195, 210 215, 160 215 C110 215, 75 195, 75 160 Z" fill="url(#ceramicWhite)" stroke="#9DA7AE" stroke-width="2" />
  <!-- Inner Basin Cavity with Drain & Neck Rest Cutout -->
  <ellipse cx="160" cy="165" rx="65" ry="32" fill="#DDE3E8" stroke="#AEB9C0" stroke-width="1.5" />
  <circle cx="160" cy="170" r="10" fill="url(#chrome6)" stroke="#444" stroke-width="1" />
  <circle cx="160" cy="170" r="4" fill="#222" />
  <!-- Soft Silicone Neck Rest on Basin Edge -->
  <path d="M215 155 C235 160, 235 175, 215 180" stroke="#1F2326" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Mixer Faucet & Shower Spray Hose -->
  <path d="M110 135 L110 115 C110 108, 120 108, 120 115 L120 125" fill="none" stroke="url(#chrome6)" stroke-width="5" stroke-linecap="round" />
  <path d="M135 130 L142 120" stroke="url(#chrome6)" stroke-width="4" stroke-linecap="round" />

  <!-- Integrated Reclining Lounge Chair -->
  <!-- Chair Main Body & Armrests -->
  <path d="M210 440 L480 440 C500 440, 510 425, 510 400 L510 320 C510 290, 480 280, 430 280 L230 280 Z" fill="url(#blackBasinBody)" stroke="#111" stroke-width="2" />

  <!-- Deep Contoured Leather Reclining Cushion -->
  <path d="M215 260 L320 260 C335 260, 345 270, 350 290 L370 370 C375 385, 470 385, 485 370 L495 385 C495 405, 450 420, 360 420 C320 420, 290 395, 280 360 L260 290 C255 270, 240 260, 215 260 Z" fill="#1C1E22" stroke="url(#gold6)" stroke-width="1.8" />

  <!-- Cushion Padding Grooves -->
  <line x1="260" y1="280" x2="330" y2="280" stroke="#363A40" stroke-width="2" />
  <line x1="290" y1="340" x2="355" y2="340" stroke="#363A40" stroke-width="2" />
  <line x1="375" y1="395" x2="465" y2="395" stroke="#363A40" stroke-width="2" />

  <!-- Sculpted Padded Armrests -->
  <rect x="250" y="270" width="180" height="24" rx="8" fill="#292D33" stroke="url(#chrome6)" stroke-width="1.2" />

  <!-- Metallic Factory Plaque & Pipe Details -->
  <rect x="130" y="340" width="60" height="18" rx="3" fill="url(#gold6)" />
  <text x="160" y="352" font-family="'Montserrat', sans-serif" font-size="7" font-weight="900" fill="#111" text-anchor="middle">AWLAD YAHYA</text>

  <!-- Badge / Tag -->
  <rect x="20" y="20" width="155" height="32" rx="6" fill="#1B1B1B" stroke="url(#gold6)" stroke-width="1" />
  <text x="97" y="41" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">أحواض غسيل الشعر</text>
</svg>
